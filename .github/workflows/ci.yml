name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v6
      - name: Start disposable PostgreSQL test database
        run: docker compose -f compose.test.yaml up --detach --wait --wait-timeout 60
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test benchmark comparison and documentation helpers
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build, format, run unit and functional tests, and verify coverage
        run: ./gradlew --no-daemon clean check
      - name: Run synthetic benchmark harness smoke (no timing gate)
        run: >-
          ./gradlew --no-daemon :postgres-adapter:postgresLoadBenchmark
          --args='--records=60 --candidate-limit=30 --concurrency=2
          --duration-seconds=1 --warmup-seconds=1 --no-match-percent=10
          --request-timeout-ms=5000'
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk-${{ matrix.java }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            postgres-adapter/build/reports/benchmark/**
          if-no-files-found: ignore
      - name: Stop and remove disposable PostgreSQL test database
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          config-file: ./.github/dependency-review-config.yml
