name: Build and publish documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build documentation (strict)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation toolchain
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Test benchmark report and site helpers
        run: python -m unittest discover -s scripts/tests -v
      - name: Build the documentation site
        run: python -m mkdocs build --strict

  benchmark:
    name: Measure merged revision
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Start disposable PostgreSQL test database
        run: docker compose -f compose.test.yaml up --detach --wait --wait-timeout 60
      - name: Measure PostgreSQL search workload
        env:
          EFS_BENCHMARK_REPORT_FILE: ${{ runner.temp }}/postgres-load.json
        run: >-
          ./gradlew --no-daemon :postgres-adapter:postgresLoadBenchmark
          --args='--records=600 --candidate-limit=100 --concurrency=4
          --duration-seconds=30 --warmup-seconds=5 --no-match-percent=10
          --request-timeout-ms=30000'
      - name: Stop PostgreSQL before component measurements
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans
      - name: Measure multilingual provider transforms
        run: >-
          ./gradlew --no-daemon :jmh-benchmarks:jmh
          --args='LanguageVariantBenchmark -bm thrpt,sample -wi 3 -i 5 -f 2
          -rf json -rff build/reports/jmh/language-jmh-raw.json'
      - name: Normalize and validate multilingual results
        run: >-
          python3 scripts/prepare_language_benchmark_report.py
          jmh-benchmarks/build/reports/jmh/language-jmh-raw.json
          --json-out '${{ runner.temp }}/language-jmh.json'
          --expected-revision '${{ github.sha }}'
      - name: Upload reports for the site build
        uses: actions/upload-artifact@v4
        with:
          name: merged-performance-reports
          path: |
            ${{ runner.temp }}/postgres-load.json
            ${{ runner.temp }}/language-jmh.json
          retention-days: 7
      - name: Stop and remove disposable PostgreSQL
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans

  build-site:
    name: Build the site with current benchmark data
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation toolchain
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Download reports for this revision
        uses: actions/download-artifact@v4
        with:
          name: merged-performance-reports
          path: benchmark
      - name: Build the documentation site
        run: python -m mkdocs build --strict
      - name: Validate report revisions and add reports to the site
        run: >-
          python scripts/build_docs_site.py benchmark/postgres-load.json
          --output site --expected-revision '${{ github.sha }}'
          --language-report benchmark/language-jmh.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish and verify the documentation site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify project path and published benchmark reports
        env:
          PUBLISHED_SITE_URL: https://wearelunatic.com/encrypted-fuzzy-search/
        run: |
          set -euo pipefail
          for path in / /getting-started/ /benchmarks/latest/ /data/latest.json /data/language-jmh.json; do
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 \
              "${PUBLISHED_SITE_URL%/}${path}" --output /dev/null
          done
          curl --fail --silent --show-error \
            "${PUBLISHED_SITE_URL%/}/data/latest.json" \
            | python -c 'import json,sys; assert json.load(sys.stdin)["schema"] == "efs.benchmark-report.v1"'
          curl --fail --silent --show-error \
            "${PUBLISHED_SITE_URL%/}/data/language-jmh.json" \
            | python -c 'import json,sys; assert json.load(sys.stdin)["schema"] == "efs.multilingual-component-report.v1"'
