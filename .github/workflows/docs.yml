name: Build and publish documentation

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  benchmark:
    name: Measure merged revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Start disposable PostgreSQL test database
        run: docker compose -f compose.test.yaml up --detach --wait --wait-timeout 60
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Run publication benchmark profile
        env:
          EFS_BENCHMARK_REPORT_FILE: ${{ runner.temp }}/postgres-load.json
        run: >-
          ./gradlew --no-daemon :postgres-adapter:postgresLoadBenchmark
          --args='--records=600 --candidate-limit=100 --concurrency=4
          --duration-seconds=30 --warmup-seconds=5 --no-match-percent=10
          --request-timeout-ms=30000'
      - name: Stop PostgreSQL before component measurements
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans
      - name: Measure multilingual provider component costs
        run: >-
          ./gradlew --no-daemon :jmh-benchmarks:jmh
          --args='LanguageVariantBenchmark -bm thrpt,sample -wi 3 -i 5 -f 2
          -rf json -rff build/reports/jmh/language-jmh-raw.json'
      - name: Normalize and validate multilingual results
        run: >-
          python3 scripts/prepare_language_benchmark_report.py
          jmh-benchmarks/build/reports/jmh/language-jmh-raw.json
          --json-out "$RUNNER_TEMP/language-jmh.json"
          --expected-revision "$GITHUB_SHA"
      - name: Upload merged-revision benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: docs-performance-report
          path: |
            ${{ runner.temp }}/postgres-load.json
            ${{ runner.temp }}/language-jmh.json
          retention-days: 7
      - name: Stop and remove disposable PostgreSQL test database
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans

  build-site:
    name: Rebuild documentation site
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: docs-performance-report
          path: benchmark
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static documentation site with the new report
        run: >-
          python3 scripts/build_docs_site.py benchmark/postgres-load.json --output site
          --expected-revision "$GITHUB_SHA" --language-report benchmark/language-jmh.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish documentation site
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
