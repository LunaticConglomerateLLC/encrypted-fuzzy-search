name: Report PR performance comparison

on:
  workflow_run:
    workflows: [PR performance benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download validated comparison artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-performance-comparison
          path: comparison
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Find pull request and update its benchmark comment
        uses: actions/github-script@v7
        env:
          WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        with:
          script: |
            const fs = require('fs');
            const run = JSON.parse(process.env.WORKFLOW_RUN);
            const linked = run.pull_requests || [];
            const prs = linked.length ? linked : (await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            })).data.filter(pr => pr.head.sha === run.head_sha || pr.merge_commit_sha === run.head_sha);
            const pr = prs.find(item => item.head.sha === run.pull_requests?.[0]?.head?.sha) || prs[0];
            if (!pr) {
              core.warning('Could not identify the pull request for this benchmark run.');
              return;
            }
            const comparison = JSON.parse(fs.readFileSync('comparison/comparison.json', 'utf8'));
            if (comparison.schema !== 'efs.benchmark-comparison.v1' || !Array.isArray(comparison.results)) {
              throw new Error('The comparison artifact has an unsupported schema.');
            }
            const language = JSON.parse(fs.readFileSync('comparison/language-jmh.json', 'utf8'));
            const languageTags = ['zh-Hans', 'ja-JP', 'ar-Arab', 'hi-Deva', 'bn-Beng', 'gu-Gujr', 'pa-Guru', 'ta-Taml', 'te-Telu', 'kn-Knda', 'ml-Mlym', 'or-Orya'];
            if (language.schema !== 'efs.multilingual-component-report.v1'
                || language.source_revision !== run.head_sha
                || language.source_tree_dirty !== false
                || language.workload?.synthetic !== true
                || !Array.isArray(language.results)
                || language.results.length !== languageTags.length) {
              throw new Error('The multilingual component artifact has an unsupported schema or revision.');
            }
            const languageResults = new Map(language.results.map(result => [result.language_tag, result]));
            if (languageResults.size !== languageTags.length || languageTags.some(tag => !languageResults.has(tag))) {
              throw new Error('The multilingual component artifact is missing language profiles.');
            }
            const runtimeString = (value, field) => {
              if (typeof value !== 'string' || !/^[A-Za-z0-9 .()+_-]{1,100}$/.test(value)) {
                throw new Error(`Invalid multilingual runtime metadata for ${field}.`);
              }
              return value;
            };
            const runtimeInteger = (value, field) => {
              if (!Number.isInteger(value) || value < 1 || value > 64) {
                throw new Error(`Invalid multilingual runtime metadata for ${field}.`);
              }
              return value;
            };
            const jmhVersion = runtimeString(language.environment?.jmh_version, 'JMH version');
            const javaVersion = runtimeString(language.environment?.java_version, 'Java version');
            const javaVm = runtimeString(language.environment?.java_vm, 'Java VM');
            const threads = runtimeInteger(language.environment?.threads, 'thread count');
            const forks = runtimeInteger(language.environment?.forks, 'fork count');
            const safeNumber = (value, field) => {
              if (typeof value !== 'number' || !Number.isFinite(value) || value <= 0) {
                throw new Error(`Invalid multilingual benchmark value for ${field}.`);
              }
              return value.toFixed(2);
            };
            const languageRows = languageTags.map(tag => {
              const result = languageResults.get(tag);
              const expectedProvider = tag === 'ja-JP' ? 'lucene-kuromoji' : 'icu4j';
              if (result.provider_id !== expectedProvider || typeof result.transform_id !== 'string'
                  || result.transform_id.length > 64) {
                throw new Error(`Invalid provider metadata for ${tag}.`);
              }
              return `| ${tag} | ${expectedProvider} | ${safeNumber(result.throughput_ops_per_microsecond, `${tag}.throughput`)} | ${safeNumber(result.latency_p50_microseconds, `${tag}.p50`)} | ${safeNumber(result.latency_p95_microseconds, `${tag}.p95`)} | ${safeNumber(result.latency_p99_microseconds, `${tag}.p99`)} |`;
            });
            const modes = new Map(comparison.results.map(item => [item.mode, item.metrics]));
            const rows = [];
            const format = (value, digits = 2) => Number.isFinite(value) ? value.toFixed(digits) : 'n/a';
            const change = value => Number.isFinite(value) ? `${value >= 0 ? '+' : ''}${value.toFixed(1)}%` : 'n/a';
            for (const [mode, label] of [['EFS_FULL', 'EFS'], ['PLAINTEXT_CONTROL', 'Plaintext control']]) {
              const metrics = modes.get(mode);
              if (!metrics) throw new Error(`Missing ${mode} results.`);
              rows.push(`| ${label} | Throughput (queries/s) | ${format(metrics.completed_throughput_qps.baseline)} | ${format(metrics.completed_throughput_qps.candidate)} | ${change(metrics.completed_throughput_qps.delta_percent)} |`);
              rows.push(`| ${label} | Warm p95 latency (ms) | ${format(metrics.warm_latency_ms_p95.baseline, 3)} | ${format(metrics.warm_latency_ms_p95.candidate, 3)} | ${change(metrics.warm_latency_ms_p95.delta_percent)} |`);
              rows.push(`| ${label} | Final recall | ${format(metrics.final_recall.baseline, 4)} | ${format(metrics.final_recall.candidate, 4)} | ${change(metrics.final_recall.delta_percent)} |`);
              rows.push(`| ${label} | Final precision | ${format(metrics.final_precision.baseline, 4)} | ${format(metrics.final_precision.candidate, 4)} | ${change(metrics.final_precision.delta_percent)} |`);
              rows.push(`| ${label} | No-match false-positive rate | ${format(metrics.no_match_false_positive_rate.baseline, 4)} | ${format(metrics.no_match_false_positive_rate.candidate, 4)} | ${change(metrics.no_match_false_positive_rate.delta_percent)} |`);
              rows.push(`| ${label} | Failures (mean count) | ${format(metrics.failures.baseline, 1)} | ${format(metrics.failures.candidate, 1)} | ${change(metrics.failures.delta_percent)} |`);
              rows.push(`| ${label} | Timeouts (mean count) | ${format(metrics.timeouts.baseline, 1)} | ${format(metrics.timeouts.candidate, 1)} | ${change(metrics.timeouts.delta_percent)} |`);
              rows.push(`| ${label} | Indexing (records/s) | ${format(metrics.index_records_per_second.baseline)} | ${format(metrics.index_records_per_second.candidate)} | ${change(metrics.index_records_per_second.delta_percent)} |`);
              rows.push(`| ${label} | Token relation (bytes) | ${format(metrics.postgres_token_relation_bytes.baseline, 0)} | ${format(metrics.postgres_token_relation_bytes.candidate, 0)} | ${change(metrics.postgres_token_relation_bytes.delta_percent)} |`);
              rows.push(`| ${label} | Record relation (bytes) | ${format(metrics.postgres_record_relation_bytes.baseline, 0)} | ${format(metrics.postgres_record_relation_bytes.candidate, 0)} | ${change(metrics.postgres_record_relation_bytes.delta_percent)} |`);
            }
            const marker = '<!-- efs-pr-performance -->';
            const body = `${marker}\n## PostgreSQL performance comparison\n\nBase \`${run.pull_requests?.[0]?.base?.sha?.slice(0, 12) || 'target'}\` → PR \`${run.head_sha.slice(0, 12)}\`. Values average two runs per revision on the same GitHub runner. The same PR-supplied test-only harness is applied to the target checkout; its production sources remain at the base revision.\n\n| Mode | Measure | Base | PR | Change |\n| --- | --- | ---: | ---: | ---: |\n${rows.join('\n')}\n\n## Multilingual provider component profile\n\nCandidate-only JMH measurements use synthetic inputs and report per-language throughput plus p50/p95/p99 transform latency. The providers are opt-in and do not exist in the target branch, so these are absolute PR component costs rather than base-to-PR deltas. JMH ${jmhVersion}, Java ${javaVersion} (${javaVm}), ${threads} thread(s), ${forks} forks.\n\n| Language tag | Provider | Throughput (ops/µs) | p50 (µs) | p95 (µs) | p99 (µs) |\n| --- | --- | ---: | ---: | ---: | ---: |\n${languageRows.join('\n')}\n\nPerformance deltas are informational; no owner-approved timing threshold exists. Review workload details in the [benchmark run](${run.html_url}). Runner and JVM variation remain, so use a reported change as a signal to investigate rather than as a definitive regression.\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
